name: Toolchain image
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - tauri-pins.json
      - scripts/**
      - .github/workflows/image.yml
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: toolchain-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      date: ${{ steps.names.outputs.date }}
      build-tag: ${{ steps.names.outputs.build-tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "build-tag=build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        id: build
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.build-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Tauri HarmonyOS toolchain
            org.opencontainers.image.description=Experimental Tauri OpenHarmony and HarmonyOS NEXT build tools
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          echo 'Candidate: `${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check tools and cross-link ARM64 and x86_64 executables
        shell: bash
        run: bash /opt/tauri-harmony/smoke.sh

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified image
        run: |
          docker buildx imagetools create \
            --tag '${{ needs.build.outputs.image }}:latest' \
            --tag '${{ needs.build.outputs.image }}:${{ needs.build.outputs.date }}' \
            '${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}'
          {
            echo '## Verified toolchain'
            echo 'Image: `${{ needs.build.outputs.image }}:latest`'
            echo 'Fixed build: `${{ needs.build.outputs.image }}:${{ needs.build.outputs.build-tag }}`'
            echo 'Digest: `${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify anonymous registry access
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          package="${IMAGE#ghcr.io/}"
          token="$(curl --fail --silent --show-error --get https://ghcr.io/token \
            --data-urlencode service=ghcr.io --data-urlencode "scope=repository:$package:pull" | jq -er .token)" || {
            echo '::error::Set the GHCR package visibility to Public in package settings, then rerun this failed job.'
            exit 1
          }
          curl --fail --silent --show-error --head \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/$package/manifests/latest"
